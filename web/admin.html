<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理 | IDP</title><style>
:root{font-family:Inter,"Noto Sans JP",system-ui,sans-serif;color:#172033;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}.top{height:68px;background:white;border-bottom:1px solid #e6e9f0;padding:0 max(24px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between}.brand{font-weight:750}.brand b{color:#5865df}.top a{font-size:14px;color:#5865df;text-decoration:none}.wrap{max-width:1120px;margin:42px auto;padding:0 24px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.head h1{margin:0;font-size:28px}.head p{margin:6px 0 0;color:#737d91;font-size:14px}.tabs{display:flex;gap:8px;margin:24px 0 14px}.tab{border:0;border-radius:8px;padding:10px 14px;background:#eceff5;color:#566074;font:600 14px inherit;cursor:pointer}.tab.active{background:#5865df;color:white}.card{background:white;border:1px solid #e6e9f0;border-radius:13px;padding:22px;box-shadow:0 6px 24px #28344a08}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.bar h2{font-size:17px;margin:0}.btn{border:0;border-radius:8px;padding:10px 13px;background:#5865df;color:white;font-weight:650;cursor:pointer}.btn.gray{background:#eceff5;color:#344054}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:#778197;font-weight:600}th,td{padding:13px 10px;border-bottom:1px solid #edf0f4}td{color:#313b50}.badge{background:#eff1f7;border-radius:20px;padding:4px 8px;margin-right:3px}.modal{position:fixed;inset:0;background:#17203370;display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{background:white;border-radius:14px;width:min(100%,500px);padding:24px}.dialog h2{margin:0 0 18px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #dce1ea;border-radius:8px;font:inherit}.field textarea{min-height:72px}.buttons{display:flex;justify-content:end;gap:8px;margin-top:20px}.msg{color:#667085;font-size:13px}.danger{color:#b42318}.hidden{display:none}@media(max-width:700px){.wrap{margin:24px auto}table{display:block;overflow:auto}.head{align-items:start}.head .btn{margin-left:12px}}
</style></head><body><header class="top"><div class="brand"><b>●</b> IDP <span style="font-weight:450;color:#8a92a4">管理</span></div><a href="/">アカウントへ戻る →</a></header><main class="wrap"><div class="head"><div><h1>管理コンソール</h1><p>ユーザーとOIDCクライアントを管理します。</p></div><button class="btn gray" id="logout">ログアウト</button></div><nav class="tabs"><button class="tab active" data-tab="users">ユーザー</button><button class="tab" data-tab="clients">OIDCクライアント</button></nav><section class="card"><div class="bar"><h2 id="title">ユーザー</h2><button class="btn" id="add">ユーザーを追加</button></div><div id="content" class="msg">読み込み中…</div></section></main><div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><form id="form"></form><div class="buttons"><button class="btn gray" id="cancel" type="button">キャンセル</button><button class="btn" id="save" type="button">作成</button></div><div id="formError" class="msg danger"></div></div></div><script>
let current='users';const content=document.getElementById('content'),title=document.getElementById('title'),add=document.getElementById('add');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));current=b.dataset.tab;title.textContent=current==='users'?'ユーザー':'OIDCクライアント';add.textContent=current==='users'?'ユーザーを追加':'クライアントを追加';load()});
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(r.status===401||r.status===403){location.assign('/login?return_to=%2Fadmin');throw Error('権限がありません')}if(!r.ok)throw Error((await r.text())||'request failed');return r.status===204?null:r.json()}
async function load(){content.innerHTML='<div class="msg">読み込み中…</div>';try{if(current==='users'){const rows=await api('/api/v1/users');content.innerHTML=rows.length?'<table><thead><tr><th>ユーザー</th><th>メール</th><th>ロール</th><th>グループ</th><th>状態</th></tr></thead><tbody>'+rows.map(u=>'<tr><td><strong>'+esc(u.display_name||u.username)+'</strong><br><span class="msg">@'+esc(u.username)+'</span></td><td>'+esc(u.email)+'</td><td>'+u.roles.map(x=>'<span class="badge">'+esc(x)+'</span>').join('')+'</td><td>'+(u.groups.length?u.groups.map(esc).join(', '):'<span class="msg">なし</span>')+' <button class="btn gray group-edit" data-user="'+esc(u.username)+'" data-groups="'+esc(JSON.stringify(u.groups))+'">編集</button></td><td>'+(u.active?'有効':'無効')+'</td></tr>').join('')+'</tbody></table>':'ユーザーがいません';document.querySelectorAll('.group-edit').forEach(b=>b.onclick=()=>editGroups(b.dataset.user,JSON.parse(b.dataset.groups)))}else{const rows=await api('/api/v1/clients');content.innerHTML=rows.length?'<table><thead><tr><th>クライアント</th><th>Redirect URI</th><th>Scopes</th><th>Grant types</th></tr></thead><tbody>'+rows.map(c=>'<tr><td><strong>'+esc(c.name)+'</strong><br><span class="msg">'+esc(c.client_id)+'</span></td><td>'+c.redirect_uris.map(esc).join('<br>')+'</td><td>'+c.allowed_scopes.map(x=>'<span class="badge">'+esc(x)+'</span>').join('')+'</td><td>'+c.grant_types.map(esc).join(', ')+'</td></tr>').join('')+'</tbody></table>':'OIDCクライアントがありません'}}catch(e){content.innerHTML='<span class="danger">'+esc(e.message)+'</span>'}}
function openForm(){groupEditUser=null;const f=document.getElementById('form');document.getElementById('formError').textContent='';document.getElementById('modalTitle').textContent=current==='users'?'ユーザーを追加':'OIDCクライアントを追加';if(current==='users'){f.innerHTML='<div class="field"><label>ユーザー名</label><input name="username" required></div><div class="field"><label>メール</label><input name="email" type="email" required></div><div class="field"><label>初期パスワード（12文字以上）</label><input name="password" type="password" minlength="12" required></div><div class="field"><label>表示名</label><input name="display_name"></div><div class="field"><label>ロール（カンマ区切り）</label><input name="roles" value="user"></div><div class="field"><label>グループ（カンマ区切り・任意）</label><input name="groups" placeholder="例: team-a, editors"></div>'}else{f.innerHTML='<div class="field"><label>Client ID</label><input name="client_id" required></div><div class="field"><label>Client Secret（24文字以上）</label><input name="client_secret" minlength="24" required></div><div class="field"><label>表示名</label><input name="name" required></div><div class="field"><label>Redirect URI（1行に1つ）</label><textarea name="redirect_uris" required></textarea></div><div class="field"><label>Scopes（カンマ区切り）</label><input name="allowed_scopes" value="openid, profile, email"></div>'}document.getElementById('modal').classList.add('open')}
let groupEditUser=null;function editGroups(username,groups){groupEditUser=username;const f=document.getElementById('form');f.innerHTML='<div class="field"><label>グループ名（カンマ区切り）</label><textarea name="groups">'+esc(groups.join(', '))+'</textarea><div class="msg">任意のグループ名を複数割り当てられます。</div></div>';document.getElementById('modalTitle').textContent='グループを編集: '+username;document.getElementById('formError').textContent='';document.getElementById('modal').classList.add('open')}
add.onclick=openForm;document.getElementById('cancel').onclick=()=>{groupEditUser=null;document.getElementById('modal').classList.remove('open')};document.getElementById('save').onclick=async()=>{const d=Object.fromEntries(new FormData(document.getElementById('form')));try{if(groupEditUser){d.groups=d.groups.split(',').map(x=>x.trim()).filter(Boolean);await api('/api/v1/users/'+encodeURIComponent(groupEditUser)+'/groups',{method:'PATCH',body:JSON.stringify(d)});groupEditUser=null}else if(current==='users'){d.roles=d.roles.split(',').map(x=>x.trim()).filter(Boolean);d.groups=(d.groups||'').split(',').map(x=>x.trim()).filter(Boolean);await api('/api/v1/users',{method:'POST',body:JSON.stringify(d)})}else{d.redirect_uris=d.redirect_uris.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);d.allowed_scopes=d.allowed_scopes.split(',').map(x=>x.trim()).filter(Boolean);d.grant_types=['authorization_code','refresh_token'];const result=await api('/api/v1/clients',{method:'POST',body:JSON.stringify(d)});alert('Client secret (この画面を閉じると再表示できません): '+result.client_secret)}document.getElementById('modal').classList.remove('open');load()}catch(e){document.getElementById('formError').textContent=e.message}};document.getElementById('logout').onclick=async()=>{try{await fetch('/api/v1/auth/logout',{method:'POST'})}finally{location.assign('/login')}};load();
</script></body></html>
