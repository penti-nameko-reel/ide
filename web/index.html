<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7fb"><title>アカウント | IDP</title><style>
:root{font-family:Inter,"Noto Sans JP",system-ui,sans-serif;color:#172033;background:#f6f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid #e8ebf1;display:flex;align-items:center;padding:0 max(24px,calc((100% - 1040px)/2));justify-content:space-between}.brand{font-weight:750;letter-spacing:.02em;font-size:19px}.brand b{color:#5865df}.top a{color:#5d6680;text-decoration:none;font-size:14px}.wrap{max-width:1040px;margin:56px auto;padding:0 24px}.eyebrow{color:#667085;font-size:13px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:26px}.head h1{font-size:30px;letter-spacing:-.03em;margin:8px 0}.card{background:#fff;border:1px solid #e6e9f0;border-radius:16px;padding:28px;box-shadow:0 8px 28px #28344a0a}.profile{display:flex;gap:20px;align-items:center}.avatar{width:80px;height:80px;border-radius:50%;background:#e9edff;object-fit:cover}.muted{color:#70798d;font-size:14px}.pill{display:inline-flex;padding:5px 10px;border-radius:20px;background:#f0f2f7;font-size:12px;margin:4px 4px 0 0}.actions{display:flex;gap:10px;margin-top:24px}button,a.btn{border:0;border-radius:9px;padding:11px 16px;font:600 14px inherit;cursor:pointer;text-decoration:none}.primary{background:#5865df;color:#fff}.secondary{background:#f0f2f7;color:#344054}.row{padding:16px 0;border-top:1px solid #edf0f4}.row label{font-size:12px;color:#737d91;display:block;margin-bottom:5px}.status{font-size:14px;color:#5c667c;margin-top:16px}.admin-link{display:none;color:#5865df!important}.error{color:#b42318}.empty{color:#667085}
</style></head><body><header class="top"><div class="brand"><b>●</b> IDP <span style="color:#8a92a4;font-weight:500">Identity</span></div><a href="/admin" class="admin-link" id="adminLink">管理画面 →</a></header><main class="wrap"><div class="head"><div><div class="eyebrow">アカウント</div><h1>プロフィール</h1></div><div class="muted">アカウント情報を確認できます</div></div><section class="card" id="card"><div class="empty">セッションを確認しています…</div></section></main><script>
const card=document.getElementById('card'),adminLink=document.getElementById('adminLink');
async function load(){try{const me=await fetch('/api/v1/auth/me');if(!me.ok){location.replace('/login?return_to=%2F');return}const u=await me.json(),username=u.preferred_username||u.username,name=u.name||u.display_name||username;const avatar='/api/v1/users/'+encodeURIComponent(username)+'/avatar';card.innerHTML='<div class="profile"><img class="avatar" src="'+avatar+'" alt=""><div><div class="eyebrow">SIGNED IN</div><h2 style="margin:6px 0 3px">'+esc(name)+'</h2><div class="muted">@'+esc(username)+'</div></div></div><div class="row" style="margin-top:24px"><label>メールアドレス</label>'+esc(u.email)+'</div><div class="row"><label>ロール</label>'+u.roles.map(x=>'<span class="pill">'+esc(x)+'</span>').join('')+'</div><div class="row"><label>グループ</label>'+(u.groups.length?u.groups.map(x=>'<span class="pill">'+esc(x)+'</span>').join(''):'<span class="muted">所属なし</span>')+'</div><div class="actions"><button class="secondary" id="logout">ログアウト</button></div><div class="status" id="status"></div>';if(u.roles.includes('admin'))adminLink.style.display='inline';document.getElementById('logout').onclick=async()=>{try{await fetch('/api/v1/auth/logout',{method:'POST'})}finally{location.assign('/login')}}}catch(e){card.innerHTML='<div class="error">プロフィールを読み込めませんでした。</div>'}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
