<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7fb"><title>ログイン | IDP</title><style>
:root{font-family:Inter,"Noto Sans JP",system-ui,sans-serif;color:#172033;background:#f6f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.visual{background:linear-gradient(145deg,#222b5c,#5865df 58%,#8590fa);color:white;padding:44px 8%;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.visual:before,.visual:after{content:"";position:absolute;border:1px solid #ffffff20;border-radius:50%;width:560px;height:560px;right:-230px;top:18%}.visual:after{width:390px;height:390px;right:-145px;top:29%}.brand{font-weight:750;font-size:19px;z-index:1}.brand b{color:#bfc5ff}.hero{max-width:500px;z-index:1;margin:auto 0}.hero small{letter-spacing:.14em;text-transform:uppercase;color:#d9ddff}.hero h1{font-size:clamp(34px,4vw,55px);line-height:1.2;letter-spacing:-.04em;margin:18px 0}.hero p{color:#e3e6ff;line-height:1.8}.foot{font-size:12px;color:#d5d9ff;z-index:1}.panel{display:grid;place-items:center;padding:36px}.box{width:min(100%,390px)}.eyebrow{font-size:12px;color:#69738a;letter-spacing:.1em;font-weight:700}.box h2{font-size:28px;letter-spacing:-.03em;margin:10px 0 8px}.sub{color:#717b90;font-size:14px;margin:0 0 30px}.field{margin:18px 0}.field label{font-size:13px;font-weight:650;display:block;margin-bottom:8px}.field input{width:100%;height:46px;border:1px solid #dce1ea;border-radius:9px;padding:0 13px;font:inherit;background:#fff;outline:none}.field input:focus{border-color:#6572e8;box-shadow:0 0 0 3px #5865df20}.submit{width:100%;border:0;background:#5865df;color:#fff;height:47px;border-radius:9px;font:650 14px inherit;margin-top:8px;cursor:pointer}.submit:hover{background:#4956cc}.error{min-height:20px;color:#b42318;font-size:13px;margin:12px 0}.notice{font-size:12px;line-height:1.6;color:#858da0;margin-top:24px}.footmobile{display:none}
@media(max-width:760px){body{grid-template-columns:1fr}.visual{display:none}.panel{min-height:100vh;padding:28px}.footmobile{display:block;color:#858da0;font-size:12px;margin-top:48px}.mobilebrand{font-weight:750;margin-bottom:45px}.mobilebrand b{color:#5865df}}
</style></head><body><aside class="visual"><div class="brand"><b>●</b> IDP <span style="font-weight:450;color:#d9ddff">Identity</span></div><div class="hero"><small>Secure identity</small><h1>ひとつのアカウントで、<br>安全につながる。</h1><p>組織のサービスへ安全にアクセスするための共通アカウントです。</p></div><div class="foot">安全な認証基盤</div></aside><main class="panel"><div class="box"><div class="mobilebrand"><b>●</b> IDP <span style="font-weight:450;color:#8a92a4">Identity</span></div><div class="eyebrow">WELCOME BACK</div><h2>アカウントにログイン</h2><p class="sub">メールアドレスまたはユーザー名を入力してください。</p><form id="form"><div class="field"><label for="login">メールアドレス / ユーザー名</label><input id="login" name="login" autocomplete="username" required autofocus></div><div class="field"><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="submit">ログイン</button><div class="error" id="error" role="alert"></div></form><div class="notice">ログインすると、要求元のサービスへ安全に戻ります。アカウントについては管理者にお問い合わせください。</div><div class="footmobile">安全な認証基盤</div></div></main><script>
const form=document.getElementById('form'),error=document.getElementById('error');form.onsubmit=async e=>{e.preventDefault();error.textContent='';const d=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok){error.textContent=r.status===401?'入力内容を確認してください。':'ログインできませんでした。';return}let next=new URLSearchParams(location.search).get('return_to')||'/';if(!next.startsWith('/')||next.startsWith('//')||next.includes('\\'))next='/';location.assign(next)}catch(_){error.textContent='サーバーに接続できません。'}};
</script></body></html>
